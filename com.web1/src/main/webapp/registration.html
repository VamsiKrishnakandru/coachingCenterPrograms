<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="registration.css">
<title>Registration</title>
</head>
<body>
	<div>
		<h1>Welcome to Vamsi's store</h1>
		<nav class="no-text-select">
			<div class="home" onclick="window.location.href='ui.html'">Home</div>
			<div class="dropdown">
				Electronics
				<div class="dropdown-content">
					<div class="items" onclick="window.location.href='pcs.html'">PCs</div>
					<div class="items" onclick="window.location.href='phones.html'">Phones</div>
					<div class="items" onclick="window.location.href='appliances.html'">Appliances</div>
				</div>
			</div>
			<div class="dropdown">
				Groceries
				<div class="dropdown-content">
					<div class="items" onclick="window.location.href='vegetables.html'">Vegetables</div>
					<div class="items" onclick="window.location.href='packed.html'">Packed
						food</div>
					<div class="items" onclick="window.location.href='diary.html'">Diary</div>
				</div>
			</div>
			<div class="reg" onclick="window.location.href='registration.html'">Sign
				In</div>
		</nav>
		<div class="layout">
			<div class="form" style="margin-bottom: 40px;">
				<div style="margin-top: 10px; margin-bottom: 20px;">Log In</div>
				<div class="aform">
					<form action="ui.html">
						<div class="ipelements">
							<label>Email Id:</label> <br><input type="text">
						</div>
						<div class="ipelements">
							<label>Password:</label> <br><input type="password">
						</div>
						<div class="ipelements" style="display:flex; justify-content:center; margin-left: 0px;">
							<input type="submit">
						</div>
					</form>
				</div>
			</div>
			<div class="form" style="margin-top: 10px; margin-bottom: 40px;">----------------OR--------------</div>
			<div class="form">
				<div style="margin-top: 10px; margin-bottom: 20px;">New User!!</div>
				<div class="aform">
					<form action="ui.html">
						<div class="ipelements">
							<label>First Name:</label> <br><input type="text">
						</div>
						<div class="ipelements">
							<label>Last Name:</label> <br><input type="text">
						</div>
						<div class="ipelements">
							<label>Email Id:</label> <br><input type="text">
						</div>
						<div class="ipelements checker">
							<span class="gen">Gender: </span> <br><span><input
								type="radio" name="gender" value="Male"
								style="margin-left: 10px;"><label
								style="margin-right: 15px;">Male</label></span> <span><input
								type="radio" name="gender" value="Female"><label>Female</label></span>
						</div>
						<div class="ipelements checker">
							<span class="gen">Category: </span> <br><span><input
								type="checkbox" name="category1" value="Customer"
								style="margin-left: 10px;"><label
								style="margin-right: 15px;">Customer</label></span> <span><input
								type="checkbox" name="category2" value="Retailer"><label>Retailer</label></span>
						</div>
						<div class="ipelements">
							<label for="birthday">Birthday:</label> <br><input type="date"
								name="birthday">
						</div>
						<div class="ipelements">
							 <label
								for="fileUpload" class="custom-btn"> Upload Govt ID: </label>
								<input type="file" id="fileUpload">
						</div>
						<div class="ipelements">
							<div class="pagebutton">
								<input type="button" value="Back"
									onclick="window.location.href='ui.html'"> <input
									type="submit">
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
